<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NIGHTGALLERY</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #09090f;
      color: white;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 24px 18px;
      background: #11111b;
      border-bottom: 1px solid #29293c;
    }
    h1 { margin: 0; color: #a78bfa; }
    header p { color: #aaaabc; margin-bottom: 0; }
    main { padding: 22px 16px; }
    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .item {
      background: #171722;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #29293c;
    }
    .item img, .item video {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: #20202c;
    }
    .item p { padding: 0 10px; font-size: 14px; }
    .empty { color: #aaaabc; line-height: 1.6; }
    footer { padding: 24px; color: #888899; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>✦ NIGHTGALLERY</h1>
    <p>Your personal photo & video gallery</p>
  </header>
  <main>
    <h2>My Gallery</h2>
    <p class="empty">Welcome to NIGHTGALLERY. Your gallery items will appear here.</p>
    <div class="gallery" id="gallery"></div>
  </main>
  <footer>© NIGHTGALLERY</footer>
</body>
</html>
